[project]
name = "rule-manager-interpreter"
version = "0.1.0"
description = "Compile restricted Python and SQL banking rules to a portable DSL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "jupyterlab>=4.6.3",
    "pyarrow>=18,<24",
    "pyspark>=4.0,<4.3",
    "sqlglot>=27,<30",
]

[project.scripts]
rule-manager = "rule_interpreter.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6,<8",
    "nbclient>=0.10,<1",
    "nbformat>=5,<6",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rule_interpreter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
